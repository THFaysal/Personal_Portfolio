spring.application.name=portfolio
server.address=0.0.0.0
server.port=${PORT:}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=${THYMELEAF_CACHE:}
spring.web.resources.cache.period=3600
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.auto-index-creation=false
app.notifications.api-key=${RESEND_API_KEY:}
app.notifications.to=${EMAIL_TO:}
app.notifications.from=${EMAIL_FROM:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:}
server.servlet.session.timeout=30m
