spring.application.name=portfolio

# Server
server.address=0.0.0.0
server.port=${PORT:}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:}
spring.web.resources.cache.period=3600

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.auto-index-creation=false

# Resend Email
app.notifications.api-key=${RESEND_API_KEY:}
app.notifications.to=${EMAIL_TO:}
app.notifications.from=${EMAIL_FROM:}

# Admin Authentication
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:}
server.servlet.session.timeout=30m

# File Uploads (CMS)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
